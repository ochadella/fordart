<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Game Bikini Bottom</title>

  <style>
    :root{
      --sea1:#5cc9ff;
      --sea2:#1aa3ff;
      --sea3:#0047ab;

      --sponge:#ffd51a;
      --patrick:#ff5aa5;
      --sand:#ffe7b1;
      --ink:#0b1b2b;
    }

    html,body{
      height:100%;
      margin:0;
      font-family:"Inter",system-ui,sans-serif;
    }

    body{
      background:linear-gradient(180deg,var(--sea1),var(--sea2),var(--sea3));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
    }

    /* ===== STAGE ===== */
    .stage{
      width:100%;
      max-width:900px;
      background:#fff;
      border-radius:20px;
      box-shadow:0 15px 40px rgba(0,0,0,.25);
      overflow:hidden;
      position:relative;
      padding-bottom:80px;
    }

    /* ===== HEADER ===== */
    header{
      padding:16px 22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:linear-gradient(90deg,var(--sponge),#ffe76a,var(--patrick));
      font-weight:800;
      color:var(--ink);
    }

    header h1{
      font-size:17px;
      margin:0;
    }

    .help{
      font-size:13px;
    }

    /* ===== GAME AREA ===== */
    .game-area{
      position:relative;
      height:480px; /* FIX UTAMA */
      background:linear-gradient(180deg,#fff,var(--sand));
    }

    .playground{
      width:100%;
      height:100%;
      position:relative;
      overflow:hidden;
    }

    /* ===== SCORE ===== */
    .scoreboard{
      position:absolute;
      top:15px;
      left:15px;
      background:rgba(255,255,255,.9);
      padding:8px 14px;
      border-radius:999px;
      display:flex;
      gap:10px;
      align-items:center;
      font-weight:800;
      box-shadow:0 8px 20px rgba(0,0,0,.15);
    }

    /* ===== ITEM ===== */
    .item{
      position:absolute;
      width:54px;
      height:54px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .item span{
      font-size:44px;
      filter:drop-shadow(0 5px 8px rgba(0,0,0,.2));
    }

    /* ===== CLAM (KERANG) ===== */
    .clam{
      position:absolute;
      top:52%;
      left:50%;
      transform:translate(-50%,-50%) scale(0);
      width:340px;
      height:240px;
      background:#fff;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      transition:.6s ease;
      z-index:5;
    }

    .clam.show{
      transform:translate(-50%,-50%) scale(1);
    }

    .clam .lid{
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:110px;
      background:#fff;
      clip-path:polygon(0 0,50% 100%,100% 0);
      transform-origin:top;
      transition:.6s ease;
    }

    .clam.open .lid{
      transform:rotateX(180deg);
    }

    .open-btn{
      font-size:40px;
      cursor:pointer;
      z-index:2;
    }

    /* ===== LETTER ===== */
    .letter{
      position:absolute;
      top:100%;
      left:50%;
      transform:translateX(-50%);
      width:90%;
      max-width:420px;
      background:#fff;
      border-radius:14px;
      box-shadow:0 8px 20px rgba(0,0,0,.25);
      opacity:0;
      transition:.6s ease;
      padding:18px;
      line-height:1.6em;
      max-height:360px; /* FIX */
      overflow-y:auto;
    }

    .clam.open .letter{
      top:-90px;  /* FIX UTAMA */
      opacity:1;
    }

    .letter h3{
      text-align:center;
      margin-top:0;
      font-size:16px;
      background:linear-gradient(90deg,var(--sponge),var(--patrick));
      -webkit-background-clip:text;
      color:transparent;
    }

    footer{
      position:absolute;
      bottom:0;
      width:100%;
      padding:10px;
      text-align:center;
      background:#f5f5f5;
      font-size:13px;
    }

    /* ===== RESPONSIVE ===== */
    @media(max-width:480px){
      .game-area{height:520px;}
      .letter{font-size:12px;}
      header h1{font-size:15px;}
    }
  </style>
</head>

<body>
  <div class="stage">
    <header>
      <h1>Mini Game Bikini Bottom 🧽⭐</h1>
      <span class="help">Kumpulkan ⭐ Patrick</span>
    </header>

    <div class="game-area">
      <div class="playground" id="playground"></div>

      <div class="scoreboard">
        ⭐ <span id="score">0</span>/10 ⏳ <span id="timer">25</span>s
      </div>
    </div>

    <!-- CLAM -->
    <div class="clam" id="clam">
      <div class="lid"></div>
      <div class="open-btn" id="openBtn">🐚</div>

    <div class="letter" id="letter">
        <h3>🧽⭐ FROM AKU ⭐🧽</h3>
        <p>Semangat Babuu, Babu tidaks sendirian ougheeeyyyy, Sumpa bu awm lek badmood ketoro bngt dan medeni</p>
        <p>HIIII NGERYYYYYYYY</p>
        <p>GO BABU GO BABU GO BABU GOOOOOO SEMANGATTT, SEMANGATTT</p>
      </div>
    </div>

    <footer>
      Klik ⭐ yang muncul sebelum waktunya habis!
    </footer>
  </div>

  <audio id="bgm" src="aldi.mp3"></audio>

  <script>
    const playground=document.getElementById('playground');
    const scoreEl=document.getElementById('score');
    const timerEl=document.getElementById('timer');
    const clam=document.getElementById('clam');
    const openBtn=document.getElementById('openBtn');
    const bgm=document.getElementById('bgm');

    let score=0;
    let timeLeft=25;
    let gameInterval,timerInterval;

    function spawnItem(){
      const item=document.createElement('div');
      item.className='item';
      item.innerHTML='<span>⭐</span>';

      item.style.left=Math.random()*(playground.clientWidth-60)+'px';
      item.style.top=Math.random()*(playground.clientHeight-120)+'px';

      item.onclick=()=>{
        score++;
        scoreEl.textContent=score;
        item.remove();
        if(score>=10) endGame();
      };

      playground.appendChild(item);
      setTimeout(()=>item.remove(),1500);
    }

    function startGame(){
      gameInterval=setInterval(spawnItem,800);
      timerInterval=setInterval(()=>{
        timeLeft--;
        timerEl.textContent=timeLeft;
        if(timeLeft<=0) endGame();
      },1000);
    }

    function endGame(){
      clearInterval(gameInterval);
      clearInterval(timerInterval);
      playground.innerHTML='';
      if(score>=10){
        clam.classList.add('show');
        openBtn.onclick=()=>{
          clam.classList.toggle('open');
          bgm.play();
        };
      }else{
        alert('Belum cukup bintang 😭 coba lagi ya!');
        location.reload();
      }
    }

    startGame();
  </script>
</body>
</html>
